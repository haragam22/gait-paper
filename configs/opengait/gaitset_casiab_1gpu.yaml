# OpenGait's configs/gaitset/gaitset.yaml, unchanged except what a 1-GPU free-tier run needs.
# Used ONLY to produce the CASIA-B GaitSet checkpoint (none is released) for validating the
# He et al. reproduction. Launch from the OpenGait dir (see notebooks/01b_gaitset_training.ipynb):
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 opengait/main.py \
#       --cfgs <repo>/configs/opengait/gaitset_casiab_1gpu.yaml --phase train [--iter N]
data_cfg:
  dataset_name: CASIA-B
  dataset_root: your_path                          # set by notebook 01b
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  num_workers: 2
  remove_no_gallery: false
  test_dataset_name: CASIA-B

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 40000
  save_name: GaitSet
  sampler:
    batch_size: 1          # changed: OpenGait requires batch_size == world size (1 GPU)
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc

loss_cfg:
  loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet

model_cfg:
  model: GaitSet
  in_channels: [1, 32, 64, 128]
  SeparateFCs:
    in_channels: 128
    out_channels: 256
    parts_num: 62
  bin_num: [16, 8, 4, 2, 1]

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [10000, 20000, 30000]
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  log_iter: 100
  with_test: false         # changed: evaluate with src/evaluation.py instead (1-GPU safe)
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 2000          # changed from 10000: resumable on free GPUs (<= ~30 min of work lost)
  save_name: GaitSet
  sync_BN: false
  total_iter: 40000        # notebook 01b overrides per chunk (multiple of save_iter)
  sampler:
    batch_shuffle: false
    batch_size: [8, 16]
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_unordered
    type: TripletSampler
